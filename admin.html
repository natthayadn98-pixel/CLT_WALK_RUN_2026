<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - จัดการริสต์แบนด์ CLT Outing Fan Run 2026</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f8fafc;
      padding: 25px;
    }
    /* ดีไซน์ตัวริสต์แบนด์ (Wristband Ticket) สำหรับพิมพ์หน้างาน */
    .wristband-preview {
      width: 100%;
      max-width: 480px;
      margin: auto;
      border: 2px dashed #0284c7;
      border-radius: 12px;
      padding: 20px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printArea, #printArea * {
        visibility: visible;
      }
      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container-fluid max-w-1200">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h3 class="fw-bold text-dark mb-0">🎽 ระบบสร้าง QR Wristband - CLT Outing Fan Run 2026</h3>
      <p class="text-muted mb-0">ดึงข้อมูลสดจาก Google Sheet สำหรับเช็คชื่อและออกสายรัดข้อมือ</p>
    </div>
    <button onclick="fetchData()" class="btn btn-primary">🔄 รีเฟรชข้อมูล</button>
  </div>

  <!-- ฟิลเตอร์ค้นหา -->
  <div class="card mb-4 border-0 shadow-sm">
    <div class="card-body row g-3">
      <div class="col-md-6">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 ค้นหาชื่อ-สกุล หรือ รหัสประจำตัว..." oninput="filterData()">
      </div>
      <div class="col-md-6">
        <select id="branchFilter" class="form-select" onchange="filterData()">
          <option value="">-- ทุกสาขา --</option>
          <option value="สำนักงานใหญ่">สำนักงานใหญ่</option>
          <option value="สาขากรุงเทพ">สาขากรุงเทพ</option>
          <option value="สาขาสงขลา">สาขาสงขลา</option>
          <option value="สาขาขอนแก่น">สาขาขอนแก่น</option>
          <option value="สาขาฉะเชิงเทรา">สาขาฉะเชิงเทรา</option>
          <option value="สาขาสมุทรสาคร">สาขาสมุทรสาคร</option>
          <option value="สาขาเชียงใหม่">สาขาเชียงใหม่</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ตารางรายชื่อ -->
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>รหัส (ID)</th>
            <th>ชื่อ - สกุล</th>
            <th>สาขา</th>
            <th>ความสนใจ</th>
            <th class="text-center">สร้างริสต์แบนด์</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="5" class="text-center py-4 text-muted">กำลังโหลดข้อมูล...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal สำหรับพรีวิว Wristband และสั่งพิมพ์ -->
<div class="modal fade" id="wristbandModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">สร้างริสต์แบนด์พนักงาน</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="printArea">
          <div class="wristband-preview shadow-sm">
            <div>
              <small class="text-uppercase text-muted fw-bold d-block">CLT Fan Run 2026</small>
              <h4 id="wbRegId" class="text-primary fw-bold mb-1"></h4>
              <h6 id="wbName" class="fw-bold mb-1 text-dark"></h6>
              <span id="wbBranch" class="badge bg-secondary"></span>
            </div>
            <div id="qrcodeCanvas"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>
        <button type="button" class="btn btn-success" onclick="window.print()">🖨️ พิมพ์ริสต์แบนด์</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSwEAZbVmfWbCYMALKgYS6cqhPEbE1TH0koWw10ph7-u6VA4xzEYPbsmKi5zXM7v2q/exec"; // ใส่ Web App URL ตัวเดียวกับ index.html
  let participants = [];
  let modalInstance = null;

  document.addEventListener('DOMContentLoaded', () => {
    modalInstance = new bootstrap.Modal(document.getElementById('wristbandModal'));
    fetchData();
  });

  async function fetchData() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">กำลังโหลดข้อมูลล่าสุด...</td></tr>';
    
    try {
      const res = await fetch(SCRIPT_URL);
      const json = await res.json();
      if (json.status === 'success') {
        participants = json.data;
        renderTable(participants);
      } else {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${json.message}</td></tr>`;
      }
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">เกิดข้อผิดพลาดในการดึงข้อมูล</td></tr>';
    }
  }

  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">ไม่พบข้อมูล</td></tr>';
      return;
    }

    tbody.innerHTML = data.map((item, idx) => `
      <tr>
        <td class="fw-bold text-primary">${item.regId}</td>
        <td class="fw-semibold">${item.fullname}</td>
        <td>${item.branch}</td>
        <td>
          <span class="badge ${item.joinStatus === 'สนใจ' ? 'bg-success' : 'bg-secondary'}">
            ${item.joinStatus}
          </span>
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary" onclick="openWristbandModal(${idx})">
            🏷️ สร้าง QR ริสต์แบนด์
          </button>
        </td>
      </tr>
    `).join('');
  }

  function filterData() {
    const searchVal = document.getElementById('searchInput').value.toLowerCase();
    const branchVal = document.getElementById('branchFilter').value;

    const filtered = participants.filter(item => {
      const matchSearch = item.fullname.toLowerCase().includes(searchVal) || item.regId.toLowerCase().includes(searchVal);
      const matchBranch = branchVal === "" || item.branch === branchVal;
      return matchSearch && matchBranch;
    });

    renderTable(filtered);
  }

  function openWristbandModal(index) {
    const item = participants[index];
    document.getElementById('wbRegId').innerText = item.regId;
    document.getElementById('wbName').innerText = item.fullname;
    document.getElementById('wbBranch').innerText = item.branch;

    // เคลียร์ QR Code เดิมก่อนสร้างใหม่
    const qrContainer = document.getElementById("qrcodeCanvas");
    qrContainer.innerHTML = "";

    // สร้าง QR Code บรรจุรหัสประจำตัว (regId)
    new QRCode(qrContainer, {
      text: item.regId,
      width: 100,
      height: 100,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    modalInstance.show();
  }
</script>

</body>
</html>
